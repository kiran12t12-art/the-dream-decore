<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="images/main logo.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Dream Decore</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    /* Hero Section */
    .heroo {
      position: relative;
      height: 40em;
      overflow: hidden;
    }

    .heroo-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .heroo-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(240, 223, 70);
      text-align: center;
      /* background-color: rgba(221, 205, 205, 0.5); */
      padding: 2rem;
      border-radius: 10px;
    }
 .info-box {
      height: 6em;
      width: 44em;
      background-color: #4a90e2;
      color: rgb(253, 155, 44);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      background-image: url(images/leaveimg.jpeg);
      margin-top: 15px;
      margin-left: 18%;
      text-align: center;
      font-family: 'Times New Roman', Times, serif;
      font-size: larger;
      margin-bottom: 5pc;

    }

    @media (max-width: 768px) {
      .info-box {
        width: 80%;
        /* Adjust width on smaller screens */

      }
    }
    /* Decoration Sections */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .image-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 10px;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .text-overlay {
      position: absolute;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Responsive for small screens */
    @media (max-width: 768px) {
      .image-box {
        max-width: 100%;
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/main logo.jpg" alt="Logo" />
    </div>
    <span class="logo-name">the dream decore</span>
    <div class="menu-toggle" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="servies.html"><i class="fas fa-paint-brush"></i> Services</a></li>
      <li><a href="about.html"><i class="fas fa-address-card"></i> About</a></li>
      <li><a href="contect.html"><i class="fas fa-phone"></i> Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="heroo">
    <video autoplay muted loop class="heroo-video">
      <source src="images/wed-banner .mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="heroo-text">
      <!-- <h1>Transform Your Space</h1>
      <p>Elegant solutions for indoor and outdoor decoration.</p>
    </div> -->
  </section>

  <div class="info-box">
    <p>Creating Dreamy Weddings: Indoor & Outdoor Decor Inspiration</p>
  </div>
  <!-- Decoration Sections -->
  <div class="container">
    <div class="image-box">
      <div class="text-overlay">Indoor</div>
      <img src="images/baraat img 1.jpg" alt="Image 1">
    </div>

    <div class="image-box">
      <div class="text-overlay">Outdoor</div>
      <img src="images/outdoor img 8.jpg" alt="Image 2">
    </div>
  </div>
</body>

</html>
